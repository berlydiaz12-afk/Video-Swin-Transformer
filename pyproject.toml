[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vswin-colab"
version = "0.1.0"
description = "Video Swin Transformer (official checkpoints) for Colab, without mmcv/mmaction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "timm>=0.9",
    "einops>=0.6",
    "numpy>=1.24",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["vswin*"]

[tool.setuptools.package-data]
vswin = ["label_map_k400.txt"]
